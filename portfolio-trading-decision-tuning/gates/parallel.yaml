# 并行执行口径（v1.6.0 起）。
#
# **一个口径只写一次。** 跑题包与判分包里的「并行怎么跑」段落都由本文件渲染
# （`pack_utils.render_parallel_md()`），两个脚本不许各写各的措辞——
# 同一件事写两遍就会有两种读法，判分方按哪种读都不算他们的错（经验沉淀 35）。
#
# 原则只有两问：
#   ① 并发之后，两次调用会不会**共享上下文**？
#   ② 并发之后，**判定条件**（尺子、版本、可见材料）会不会变？
# 两问都答「不会」才可以并。答「会」的写进 serial/atomic 段，一条都不许并。

version: 1

principle: >-
  能并的全并，不能并的写清楚为什么不能并。并发只许买速度，不许买走可比性。

# ── 跑题（阶段 3，外发给跑题方）──────────────────────────────────
run:
  unit: case                 # 并发单位：一题一会话
  default_concurrency: 4     # 建议并发度；平台扛得住可以往上调到 max
  max_concurrency: 8
  parallel_ok: |-
    同一遍内的各题彼此独立，**可以并发跑**，不必一题跑完再跑下一题。
  hard_rules:
    - "**一题一会话，不要为了并行把多题塞进同一会话。** 会话共享上下文，前一题的材料会污染后一题。"
    - "**主版本与噪声底复跑不要同时在跑。** 两遍用的是同一个包，但在平台上是两个技能版本；两个版本同时挂着，逐题的版本校验就可能张冠李戴。先跑完一遍、校验完版本，再跑第二遍；一遍内部的各题随便并行。"
    - "**并发不改变「等待不算重跑」。** 占位（「已委派…后台执行中」）按抓取未完成处理：回同一会话只读补抓，不发任何消息，不重新发题。"
    - "**并发度只影响速度，不影响判定。** 中途不许因为「这题跑得慢」换模型、换路线、改题面或补提示——那一题就与其余题不是同一个条件了。"

# ── 判分（阶段 4，外发给判分方）──────────────────────────────────
judge:
  unit: pass                 # 并发单位：一轮一个互不可见的 subagent
  atomic: |-
    **同一题的四方必须在同一次调用里判完。** 拆开四方就没有比较可言，这条不可并、不可分片。
  parallel_ok: |-
    三轮之间必须隔离，所以三轮**天然就该并发**：三个 subagent 一次性同时发起，
    不要等第一轮判完再开第二轮——串行等待本身就给编排方开了一条「上一轮是怎么判的」记忆通道。
  hard_rules:
    - "**三轮同时发起，互不可见。** 三个 subagent 的输入必须逐字相同，只有 pass 目录路径不同。"
    - "**不许把上一轮的结论、倾向、「注意某题有坑」带给下一轮。** 并发发起正是为了让这件事没有发生的机会。"
    - "**编排方不读答复内容。** 只做调度、回收、格式核验；读了就会通过任务描述泄露给 subagent。"
    - "**不许因为三轮结果不一致就去统一口径、修正、复核后取一个。** 三轮不一致正是本包要测的东西（噪声底）。"
    - "**不许跨 pass 比对或按文件哈希对齐三轮的洗牌映射。** 甲乙丙丁每轮重新打乱是设计，不是错误。"
  shard:
    default: 1               # 默认不分片：一轮内的题由同一个 subagent 判完
    max: 4
    drift_threshold_mean: 0.5
    why_off_by_default: |-
      一轮内的题由同一个 subagent 判，它对这一轮的尺度是自洽的。拆片之后，
      片与片之间的尺度只能靠 prompt 对齐，多出一个方差源——而噪声底本来就已经接近 1 分。
      三轮并发已经把判分时间压到三分之一；分片是**拿可比性换速度**，
      只在题量大到一片判不完（经验值 >12 题）时才值得开。
    preconditions:           # 要开分片，四条全部满足才许开
      - "分片数在**看到任何读数之前**定死，写进 manifest 与包内 README；一经用于判分就不改，要改就当成新 scheme。"
      - "**前后同施**：同一批比较里的所有版本（含对照基线的重判）必须用同一个分片数，否则是松尺量自己、紧尺量对照。"
      - "每片的 prompt **逐字相同**，只换题号清单；片与片之间不共享上下文，不互相看结果。"
      - "判完必须跑 `check_judge_quality.py --shard-map`，把**跨片尺度漂移**读数写进报告；超过 drift_threshold_mean 时该轮标「分片尺度存疑」，不得直接进准出核算。"

# ── 调优侧自己（离线阶段 0-2，主 agent 执行）──────────────────────
local:
  parallel:
    - "逐题的静态核验（lint_skill、红项扫描）：题与题独立，一次全发，不要一题一题等"
    - "G2 离线复演：逐题独立"
    - "RedTeam 跨节两两互斥检查：按节对分组，各组独立"
    - "多个实例的 selftest、多份附件的抽取"
    - "读材料：需要读的文件一次性全读，不要读一个想一下"
  serial:
    - "Patcher 改同一份 SKILL.md：并发会互相覆盖，必须串行"
    - "G1 → G2 → RedTeam 有先后依赖，前一道没过不许开下一道"
    - "人审卡：等人，不等就是跳卡"
