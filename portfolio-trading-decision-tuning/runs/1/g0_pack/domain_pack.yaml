distinctions:
- pair:
  - 拟卖出数量
  - 实际可完成数量
  rule: 跌停、停牌、零买盘、部分成交下的委托量不得计为已完成，也不得计入当天可得现金； 条件不成立时成交量与现金记 0，并保留由此产生的超限状态
  weight: critical
- pair:
  - 账面数量
  - 当下可执行数量
  rule: 账面持仓 → 券商可卖 → T+1 复核可卖 → 当下可执行，四档不可互相替代。 决策时点已收盘或非交易日时，当下可执行量为 0，最早执行日是下一交易日
  weight: critical
- pair:
  - 权重上限
  - 风险贡献上限
  rule: 两者是不同约束，满足前者不等于满足后者。必须先判哪一条更紧，用更紧的那条反解数量； 只压到权重达标就收口的方案不得标合规
  weight: critical
- pair:
  - 硬约束
  - 客户软偏好
  rule: 硬约束不可协商。不得把"继续减仓"与"接受约束违反"并列交客户选择； 偏好与硬约束不可兼得时，明确写出不可兼得并给合规方案
  weight: critical
- pair:
  - 确实无法消除的约束
  - 可由其他卖出消除的约束
  rule: 冻结被保护持仓后必须对其余标的逐条重算，只保留真正绑定的那几条； 把可压回的约束一并判死，或把可执行的预案判成不可执行，都是主结论错误
  weight: critical
- pair:
  - 累计总卖出量
  - 本阶段追加量
  rule: 每个数量必须标明口径与基准持仓；同一张情景清单或同一条规则内混用两种口径即为错误
  weight: high
- pair:
  - 重建成本
  - 除权除息参考价
  rule: 除息参考价只用作当日涨跌幅参照，不得当成本。已算出重建成本后成本列不得再被替换； 总回报=价格损益+已确认股息，股息按到账日单列
  weight: high
- pair:
  - 划出前净资产
  - 划出后净资产
  rule: 材料表述为"备妥/准备/预留"时资金仍在账内，权重与硬约束分母用划出前净资产； 擅自假定已划出会把可行方案误判为无解
  weight: high
- pair:
  - 最不利压力情景
  - 任一压力情景
  rule: 多情景逐一判定，PASS/FAIL 取最不利那一档；连续多日冲击须逐日复合，不能只算首日。 取较轻档判 PASS，等于把仍超预算的方案当合规交付
  weight: high
- pair:
  - 未决差异
  - 已解释差异
  rule: 两套记录冲突时并列两个锚并照实列出残差，不得用其他资产或四舍五入补平； 保留未决事项不自行解释是加分项，不是缺陷
  weight: high
- pair:
  - 费用
  - 总交易成本
  rule: 总交易成本含佣金、税费与题内滑点；并列方案只按费用排序即为错误
  weight: medium
- pair:
  - 资产的可赎回性
  - 该资产的交易授权
  rule: 未获交易授权不等于不属于低风险资产；两者混淆会漏掉题面要求的本金口径
  weight: medium
- pair:
  - 材料内派生指标
  - 材料外行情与来源
  rule: 现价与序列只能来自材料，派生指标须写明样本区间；指标有通行变体时标注所用变体， 不得用非通行变体支撑极端结论。标注材料中不存在的数据来源即为编造
  weight: high
- pair:
  - 决策交付件
  - 行情展示件
  rule: 交付件按决策件命名与组织（诊断、情景、纪律），行情图只作附属证据； 唯一交付件是行情走势图时，按"遗漏核心交付主工件"处理
  weight: high
- pair:
  - 使被保护指标恶化的触发事件
  - 使该指标改善的事件
  rule: 触发条件里的可观察事件必须确实使被保护的指标变差。标的下跌本身会压低它的权重与联动损失率， 以"该标的继续下跌"作为继续减仓的触发，方向不成立
  weight: high
- pair:
  - 日历日
  - 交易日与资金可用日
  rule: 每个关键日期核对星期与是否为交易日；非交易日不得出现在动作行，须顺延到下一可执行交易日。 行动日只能取自材料给出的交易日或资金可用日，不得自行新增材料外的日期
  weight: critical
- pair:
  - 限价委托的可能结果
  - 确定成交
  rule: 成交与否取决于当时买盘与涨跌停状态。禁止"确保成交""确定性最高"这类表述， 每条委托须写明未成交时转入哪条后手
  weight: high
- pair:
  - 有效报价
  - 陈旧报价
  rule: 报价超时效即不得用于交易后权重与风险测算，相关批次不得标为可分配； 批准或执行前须再次写明报价时效与可卖量仍然有效
  weight: high
- pair:
  - 当日回款
  - 下一交易日名义额
  rule: 两者不得混列在同一张汇总里；跨日金额分行给出并标明到账日
  weight: medium
- pair:
  - 约束反解出的临界数量
  - 按交易单位取整后的可执行数量
  rule: 临界值必须向使约束达标的方向按整手取整，并验证相邻一手不满足； 取整方向搞反会让"达标"方案实际仍然超限
  weight: high
- pair:
  - 指标标签
  - 指标口径
  rule: 表头与标签必须写明时点与分母。把触发时点的比例标成支付后集中度这类错配， 会让执行人按错误前提下单
  weight: high
- pair:
  - 批次成本的经济归因
  - 券商端可指定批次
  rule: 批次归属只是成本归因，能否在券商端指定卖出批次须另行确认并写明
  weight: medium
- pair:
  - 以组合权重与约束为锚
  - 以个股涨跌幅为锚
  rule: 动作阈值锚定组合权重、集中度与风险预算；只按个股涨跌幅设阈值不构成组合层面的纪律
  weight: medium
- pair:
  - 执行层约束已展开
  - 只给观点判断
  rule: 费用税费、可卖数量、整手、结算到账、单日成交量上限（如 ADV 参与率）必须逐项展开—— 这是持仓交易决策与纯技术分析的分界
  weight: high
- pair:
  - 信息充分下的单一路径
  - 信息不足下的多情景降级
  rule: 风险信息不足仍给单一确定路径即为降级不足，须给多情景备选并写明各自触发条件
  weight: high
- pair:
  - 逐订单逐约束证据
  - 汇总计数
  rule: 证据要能逐订单、逐约束追溯到数量与取值，不得只给"问题计数"这类汇总； 无法计算的项写明 NOT_COMPUTED 及原因，不留空
  weight: medium
- pair:
  - 可用数据
  - 低置信识别结果与未来时点数据
  rule: 低置信 OCR、口述成本、停牌前价格、决策时点之后的数据一律排除并说明排除理由， 不得直接当作可成交数据
  weight: high
- pair:
  - 证券口径的敞口
  - 含该币种现金的敞口
  rule: 集中度逐层判定：单票、前三大、行业或主题、币种敞口。币种敞口须计入该币种现金； 题面设过上限的每一层都要判，漏判一层即为主结论错误
  weight: critical
- pair:
  - 主路径
  - 不依赖该笔成交的后手
  rule: 首选标的无法成交时，须当场反解一条不依赖该笔成交、仍满足硬约束的路径； 反复尝试同一笔不可成交的委托不算后手
  weight: high
taxonomy:
  name: 数量可得性四档
  axes:
  - id: a
    question: 该数量是否已解除所有交易限制（T+1、锁定、质押、停牌）？
  - id: b
    question: 当前时刻是否在交易时段内，且该标的当前有可成交对手盘（非涨跌停、非零买盘）？
  states:
    当下可执行:
      requires:
      - a
      - b
      evidence: 可卖量与报价均在有效期内，且决策时点处于交易时段
    今日可卖未可执行:
      requires:
      - a
      evidence: 限制已解除但已收盘、停牌、跌停或零买盘，最早执行日为下一交易日
    择日可卖:
      requires: []
      evidence: T+1、锁定或解冻日未到，须写出解冻日与其对应的交易日
    不可动用:
      requires: []
      evidence: 质押、冻结或被用户声明保护；只在穷尽其余批次仍不足时动用并写明这是对偏好的偏离
hard_gates:
- 对象、口径或期间错误（改动题面给定的时点、持仓、阈值或约束）
- 编造事实、数值或来源（含材料外的现价、指标、数据来源）
- 越权执行（声称已下单、已连接券商、已划转、已交付不存在的文件）
- 遗漏核心交付主工件（持仓勾稽与盈亏、风险预算判定、情景、if→then 纪律，缺一即命中）
- 分解型占比失去含义（各项之和显著偏离 100%）仍据此排序或下结论
- 把仍超硬约束的方案标为合规或 PASS
- 硬约束被客户软偏好覆盖，或以"客户知情接受违反"收口
- 把不可成交标的计入当天可得现金，或把委托写成已完成
- 硬约束仍超限期间给出加仓、回补或做 T 等扩大该敞口的动作
- 正文结论与附件数值相互矛盾（同一指标出现两个数）
- 账户勾稽漏计某类资产，或与后续采用的净资产口径自相矛盾
- 交付工作簿存在公式错误（#REF!/#VALUE!/#NAME? 等）或关键结果硬编码
not_quality_signals:
- 篇幅长短
- 表格数量
- 公式数量
- 交付件数量
- 语气自信程度
- 三级标题数量
- 图表是否精美
tiers:
  direct:
    budget_chars: 4000
    判定: 单一标的、无具体日期约束、无附件或仅一份价格序列
  brief:
    budget_chars: 7000
    判定: 组合层面但约束条数有限，或题面限定只交一个文件
  full:
    budget_chars: 12000
    判定: 多附件、多硬约束并存、含结算与跨币种、要求分日执行计划
