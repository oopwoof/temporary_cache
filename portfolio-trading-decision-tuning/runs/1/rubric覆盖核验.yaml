统计:
  可判点总数: 61
  初稿命中: 33
  初稿覆盖率: 0.541
  补条目后命中: 61
  最终覆盖率: 1.000
  补录点数: 28
  说明: >-
    「补录: true」表示该可判点在 14 条 distinctions 的初稿里没有对应条目，是这次覆盖核验逼出来的。
    补录点集中在三类：执行层细节（报价时效、ADV、整手取整、跨日金额）、
    交付物一致性（正文与附件、工作簿公式、勾稽漏项）、以及日历与表述纪律。
    覆盖率 100% 不等于 rubric 正确，只说明没有已知可判点落在 rubric 之外；
    rubric 是否判得准要靠 G0 一致率，而 G0 不能自评（见人审卡卡 4）。
